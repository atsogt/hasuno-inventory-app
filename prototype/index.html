<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Hasuno — Inventory Requests</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap');

  :root{
    --ink:#1C2B2A;
    --ink-soft:#3A4A47;
    --paper:#F6F1E6;
    --paper-dim:#ECE4D2;
    --card:#FBF8F1;
    --line:#D9CEB4;
    --accent:#B23A2E;
    --accent-dim:#8f2e24;
    --success:#4B6B4E;
    --warn:#9C6B1E;
    --radius:14px;
    font-family:'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); height:100%;}
  #root{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); position:relative;}

  .mono{font-family:'IBM Plex Mono', monospace;}
  .muted{color:var(--ink-soft);}

  /* ---------- top bar ---------- */
  .topbar{
    padding:18px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; flex-direction:column; line-height:1.1;}
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand-logo{width:30px; height:30px; object-fit:contain; flex:none;}
  .brand .mark{font-weight:900; font-size:20px; letter-spacing:0.02em;}
  .brand .sub{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft); margin-top:2px;}
  .whoami{text-align:right; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .whoami b{display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-size:14px; color:var(--ink); font-weight:700;}
  .logout-btn{background:none; border:none; color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:11px; cursor:pointer; padding:4px 0; text-decoration:underline;}

  /* ---------- generic ---------- */
  .screen{flex:1; padding:18px 20px 100px; overflow-y:auto;}
  h2.section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.14em; color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace; margin:0 0 14px; display:flex; align-items:center; gap:8px;
  }
  h2.section-title::after{content:""; flex:1; height:1px; background:var(--line);}

  button{font-family:inherit; cursor:pointer;}
  .btn{
    border:none; border-radius:10px; padding:13px 16px; font-weight:700; font-size:14.5px;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:active{background:var(--ink-soft);}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-accent:active{background:var(--accent-dim);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  input, select{
    width:100%; padding:12px 13px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--ink); outline-offset:1px;}
  label{font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; display:block; margin:0 0 6px;}
  .field{margin-bottom:14px;}

  /* ---------- login ---------- */
  .login-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px;}
  .login-stamp{
    width:96px; height:96px; margin-bottom:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .login-stamp img{width:100%; height:100%; object-fit:contain;}
  .login-title{font-weight:900; font-size:24px; margin:0 0 2px;}
  .login-sub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:28px;}
  .login-card{width:100%; max-width:320px;}
  .login-error{color:var(--accent); font-size:12.5px; font-family:'IBM Plex Mono',monospace; margin-top:10px; text-align:center;}
  .demo-note{margin-top:26px; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-align:center; line-height:1.6; border-top:1px dashed var(--line); padding-top:14px;}

  /* ---------- item grid ---------- */
  .item-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .item-cell{display:flex; flex-direction:column;}
  .item-btn{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 10px;
    text-align:left; display:flex; flex-direction:column; gap:4px; width:100%;
  }
  .item-btn:active{background:var(--paper-dim); transform:scale(0.98);}
  .item-idx{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);}
  .item-name{font-weight:700; font-size:15px;}
  .item-qty{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft);}
  .item-edit-link{
    align-self:flex-end; background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:10px;
    color:var(--ink-soft); text-decoration:underline; padding:5px 2px;
  }
  .item-edit-link:active{color:var(--accent);}

  .item-pending-card{
    background:var(--card); border:1px solid var(--accent); border-radius:10px; padding:12px 10px 10px;
    display:flex; flex-direction:column; gap:8px;
  }
  .item-pending-top{
    display:flex; flex-direction:column; gap:3px; width:100%; text-align:left;
    background:none; border:none; padding:0; color:inherit; font:inherit;
  }
  .qty-stepper{display:flex; align-items:center; gap:6px;}
  .qty-btn{
    width:30px; height:30px; flex:none; border-radius:8px; border:1px solid var(--line); background:var(--paper);
    font-family:'IBM Plex Mono',monospace; font-size:16px; line-height:1; color:var(--ink);
  }
  .qty-btn:active{background:var(--paper-dim); transform:scale(0.96);}
  .qty-input{
    flex:1; min-width:0; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:15px;
    border:1px solid var(--line); border-radius:8px; padding:6px 4px; background:var(--paper); color:var(--ink);
  }
  .item-pending-bar{height:3px; background:var(--line); border-radius:2px; overflow:hidden;}
  .item-pending-fill{
    height:100%; width:100%; background:var(--accent); transform-origin:left;
    animation-name:pendingShrink; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes pendingShrink{from{transform:scaleX(1);} to{transform:scaleX(0);}}
  .item-pending-actions{display:flex; justify-content:space-between;}
  .item-pending-send, .item-pending-cancel{
    background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    text-decoration:underline; padding:2px;
  }
  .item-pending-send{color:var(--success);}
  .item-pending-cancel{color:var(--ink-soft);}

  .other-row{display:flex; gap:8px;}
  .other-row input{flex:1;}

  /* ---------- ticket / chit card ---------- */
  .chit{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:2px;
    padding:14px 16px 14px; margin-bottom:16px;
    box-shadow:0 1px 0 var(--line);
  }
  .chit::before{
    content:""; position:absolute; left:0; right:0; top:-1px; height:6px;
    background-image:radial-gradient(circle at 6px 0, transparent 5px, var(--paper) 5.5px);
    background-size:12px 12px; background-repeat:repeat-x; background-position:0 -3px;
  }
  .chit-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .chit-item{font-weight:700; font-size:16px;}
  .qty-tag{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500; color:var(--ink-soft);}
  .chit-meta{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.7;}
  .chit-elapsed{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px;
    white-space:nowrap; height:fit-content;
  }
  .elapsed-fresh{background:#E6EEE6; color:var(--success);}
  .elapsed-warn{background:#F3E7D2; color:var(--warn);}
  .elapsed-stale{background:#F3DEDB; color:var(--accent);}
  .chit-reminder-due{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .chit-actions-row{margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .del-link{background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); text-decoration:underline; padding:4px;}
  .del-link:active{color:var(--accent);}

  /* ---------- erase-all variants (Requests screen) ---------- */
  .erase-all-link{
    background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--accent); text-decoration:underline; padding:2px 4px; white-space:nowrap;
  }
  .erase-all-link:active{color:var(--accent-dim);}
  .erase-all-variants{margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:10px;}
  .erase-variant-label{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); letter-spacing:0.06em; text-transform:uppercase;}
  .erase-icon-btn{
    align-self:flex-start; background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:9px 14px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--accent);
  }
  .erase-icon-btn:active{background:var(--paper-dim);}
  .erase-inline-confirm{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--card);
    border:1px solid var(--accent); border-radius:10px; padding:10px 12px; font-size:13px;
  }
  .erase-inline-confirm span{flex:1; min-width:140px;}
  .btn-inline-yes, .btn-inline-no{
    border:none; border-radius:8px; padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700;
  }
  .btn-inline-yes{background:var(--accent); color:#fff;}
  .btn-inline-yes:active{background:var(--accent-dim);}
  .btn-inline-no{background:var(--paper-dim); color:var(--ink);}
  .set-reminder-link{
    background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
    text-decoration:underline; padding:4px 4px 4px 0;
  }
  .set-reminder-link:active{color:var(--ink);}
  .reminder-tag{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--warn); display:flex; align-items:center; gap:6px;
  }
  .reminder-tag.reminder-due{color:var(--accent); font-weight:600;}
  .clear-reminder-link{background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); text-decoration:underline; padding:2px;}
  .clear-reminder-link:active{color:var(--accent);}

  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty-state .glyph{font-size:30px; margin-bottom:10px;}
  .empty-state p{font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.6; margin:0;}

  /* ---------- accounts ---------- */
  .acct-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 0; border-bottom:1px solid var(--line);
  }
  .acct-name{font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px;}
  .acct-contact{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:3px;}
  .acct-contact-empty{font-style:italic; opacity:0.7;}
  .role-tag{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.08em;
    padding:2px 7px; border-radius:20px; background:var(--paper-dim); color:var(--ink-soft);
  }
  .role-tag.role-owner{background:var(--ink); color:var(--paper);}
  .role-tag.role-manager{background:var(--accent); color:#fff;}
  .locked-badge{color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:10.5px;}
  .acct-actions{display:flex; gap:6px;}
  .icon-btn{background:var(--paper-dim); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-family:'IBM Plex Mono',monospace; font-size:11px;}
  .icon-btn.danger{color:var(--accent);}

  .panel-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 16px; margin-bottom:24px;}
  .panel-card h3{margin:0 0 14px; font-size:13px; text-transform:uppercase; letter-spacing:0.1em; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft);}
  .panel-card .field:last-of-type{margin-bottom:16px;}
  .field-label-plain{font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; display:block; margin:0 0 8px;}
  .panel-empty-note{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin:0;}

  .worker-check-grid{display:flex; flex-direction:column; gap:2px; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .worker-check-row{display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--paper); font-size:14px;}
  .worker-check-row:nth-child(even){background:var(--paper-dim);}
  .worker-check-row input{width:auto; accent-color:var(--ink);}

  .when-radio-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .when-radio-row{display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:13px;}
  .when-radio-row input{width:auto; accent-color:var(--ink);}

  .staff-reminder-banner{
    display:flex; align-items:flex-start; gap:10px; background:#FBEFE9; border:1px solid var(--accent);
    border-radius:12px; padding:14px; margin-bottom:20px;
  }
  .staff-reminder-icon{font-size:18px; line-height:1;}
  .staff-reminder-body{flex:1;}
  .staff-reminder-title{font-weight:700; font-size:13px; color:var(--accent-dim);}
  .staff-reminder-msg{font-size:13.5px; margin-top:3px; line-height:1.4;}
  .staff-reminder-dismiss{
    background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--accent);
    text-decoration:underline; padding:2px; white-space:nowrap;
  }

  .staff-reminder-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .staff-reminder-row-msg{font-size:13.5px; font-weight:600;}
  .staff-reminder-row-meta{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:3px;}

  .reminder-history-tab-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 14px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; color:var(--ink);
    margin-bottom:18px;
  }
  .reminder-history-tab-btn:active{background:var(--paper-dim);}
  .reminder-history-count{
    background:var(--accent); color:#fff; font-size:10.5px; border-radius:20px; padding:1px 8px;
  }
  .reminder-history-list{max-height:50vh; overflow-y:auto; margin-bottom:18px;}
  .reminder-history-list .staff-reminder-row:last-child{border-bottom:none;}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:sticky; bottom:0; display:flex; border-top:1px solid var(--line);
    background:var(--paper); padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    gap:8px; z-index:5;
  }
  .tab-btn{
    flex:1; background:none; border:none; padding:8px 4px; border-radius:10px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.04em; color:var(--ink-soft);
    text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .tab-btn.active{color:var(--ink); background:var(--paper-dim); font-weight:600;}
  .tab-dot{width:5px; height:5px; border-radius:50%; background:var(--accent); display:none;}
  .tab-btn.has-badge .tab-dot{display:block;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(28,43,42,0.45); display:flex; align-items:flex-end;
    justify-content:center; z-index:20;
  }
  .modal-card{
    background:var(--paper); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom)); box-shadow:0 -4px 20px rgba(0,0,0,0.15);
  }
  .modal-card h3{margin:0 0 8px; font-size:17px;}
  .modal-card p{margin:0 0 20px; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions .btn{flex:1;}
  .reminder-quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .reminder-quick-btn{font-size:13px; padding:11px 10px;}
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:10px 18px; border-radius:30px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    z-index:30; box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  "use strict";

  var DEFAULT_ITEMS = ["Rice","Nori","Wasabi","Su (Vinegar)","Uni","Toro","Ikura","Gloves","Ginger","Green Tea","Charcoal","Soy Sauce"];

  function makeDefaultItems(){
    return DEFAULT_ITEMS.map(function(name){ return {id:uid(), name:name, amount:1}; });
  }

  // Normalizes older saved data (plain strings, or objects missing an id/amount) to {id,name,amount}
  function normalizeItems(raw){
    return raw.map(function(it){
      if(typeof it === "string") return {id:uid(), name:it, amount:1};
      return {id: it.id || uid(), name: it.name, amount: (it.amount && it.amount > 0) ? it.amount : 1};
    });
  }

  var state = {
    accounts: null,
    messages: null,
    items: null,
    currentUser: null,
    view: "login",       // login | request | myRequests | allRequests | accounts
    loginError: "",
    loading: true,
    modal: null,          // {title, body, onConfirm, confirmLabel, danger}
    itemEditor: null,     // {id, name, amount} while editing a catalog item
    reminderEditor: null, // {messageId} while setting a reminder
    acctEditor: null,     // {id, phone, email} while editing an account's contact info
    staffReminders: null,
    reminderHistory: null, // permanent log of every staff reminder ever scheduled, survives cancel/dismiss
    toast: null,
    confirmEraseAllInline: false, // inline "erase all" confirm (Variant C on Requests screen)
    showReminderHistory: false,   // Reminder History popup open (Accounts screen)
    confirmClearHistoryInline: false // inline "clear all history" confirm, inside the history popup
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // Normalizes older saved account data that may be missing phone/email fields
  function normalizeAccounts(raw){
    return raw.map(function(a){
      return {
        id:a.id, name:a.name, password:a.password, role:a.role, locked:!!a.locked,
        phone:a.phone || "", email:a.email || ""
      };
    });
  }

  function defaultAccounts(){
    return [
      {id:uid(), name:"Andy", password:"owner2026", role:"owner", locked:false, phone:"", email:""},
      {id:uid(), name:"Manager", password:"manager2026", role:"manager", locked:false, phone:"", email:""},
      {id:uid(), name:"Worker", password:"worker2026", role:"worker", locked:false, phone:"", email:""}
    ];
  }

  async function loadData(){
    try{
      var accRes = await window.storage.get("accounts", true);
      state.accounts = normalizeAccounts(JSON.parse(accRes.value));
    }catch(e){
      state.accounts = defaultAccounts();
      await window.storage.set("accounts", JSON.stringify(state.accounts), true);
    }
    try{
      var msgRes = await window.storage.get("messages", true);
      state.messages = JSON.parse(msgRes.value);
    }catch(e){
      state.messages = [];
      await window.storage.set("messages", JSON.stringify(state.messages), true);
    }
    try{
      var itemRes = await window.storage.get("items", true);
      state.items = normalizeItems(JSON.parse(itemRes.value));
    }catch(e){
      state.items = makeDefaultItems();
      await window.storage.set("items", JSON.stringify(state.items), true);
    }
    try{
      var srRes = await window.storage.get("staffReminders", true);
      state.staffReminders = JSON.parse(srRes.value);
    }catch(e){
      state.staffReminders = [];
      await window.storage.set("staffReminders", JSON.stringify(state.staffReminders), true);
    }
    try{
      var rhRes = await window.storage.get("reminderHistory", true);
      state.reminderHistory = JSON.parse(rhRes.value);
    }catch(e){
      state.reminderHistory = [];
      await window.storage.set("reminderHistory", JSON.stringify(state.reminderHistory), true);
    }
    state.loading = false;
    render();
  }

  async function saveAccounts(){
    await window.storage.set("accounts", JSON.stringify(state.accounts), true);
  }
  async function saveMessages(){
    await window.storage.set("messages", JSON.stringify(state.messages), true);
  }
  async function saveItems(){
    await window.storage.set("items", JSON.stringify(state.items), true);
  }
  async function saveStaffReminders(){
    await window.storage.set("staffReminders", JSON.stringify(state.staffReminders), true);
  }
  async function saveReminderHistory(){
    await window.storage.set("reminderHistory", JSON.stringify(state.reminderHistory), true);
  }

  function showToast(msg){
    state.toast = msg;
    render();
    setTimeout(function(){ state.toast = null; render(); }, 1800);
  }

  function fmtDate(iso){
    var d = new Date(iso);
    return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"}) + " · " +
           d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }

  function elapsedInfo(iso){
    var ms = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(ms/60000);
    var hrs = mins/60;
    var label;
    if(mins < 1) label = "just now";
    else if(mins < 60) label = mins + "m ago";
    else if(hrs < 24) label = hrs.toFixed(1).replace(/\.0$/,"") + "h ago";
    else label = Math.floor(hrs/24) + "d ago";
    var cls = "elapsed-fresh";
    if(hrs >= 1 && hrs < 3) cls = "elapsed-warn";
    if(hrs >= 3) cls = "elapsed-stale";
    return {label:label, cls:cls};
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- auth actions ---------------- */
  function attemptLogin(name, pass){
    var acct = state.accounts.find(function(a){
      return a.name.toLowerCase() === name.trim().toLowerCase();
    });
    if(!acct){ state.loginError = "No account with that name."; render(); return; }
    if(acct.locked){ state.loginError = "This account is locked. See your manager."; render(); return; }
    if(acct.password !== pass){ state.loginError = "Incorrect password."; render(); return; }
    state.currentUser = acct;
    state.loginError = "";
    state.view = "request";
    render();
  }

  function logout(){
    state.currentUser = null;
    state.view = "login";
    render();
  }

  /* ---------------- pending item stepper (tap to build qty, auto-sends) ---------------- */
  var PENDING_SEND_MS = 3000;
  var pendingByItem = {};   // itemId -> {qty, sendAt}
  var pendingTimers = {};   // itemId -> setTimeout handle

  function beginOrBumpPending(item){
    if(pendingByItem[item.id]){ bumpPendingQty(item.id, 1); return; }
    pendingByItem[item.id] = {qty: (item.amount && item.amount > 0) ? item.amount : 1, sendAt: 0};
    schedulePendingSend(item.id);
    render();
  }

  function bumpPendingQty(id, delta){
    var p = pendingByItem[id];
    if(!p) return;
    setPendingQty(id, p.qty + delta);
  }

  function setPendingQty(id, qty){
    var p = pendingByItem[id];
    if(!p) return;
    p.qty = Math.max(0, qty);
    schedulePendingSend(id);
    render();
  }

  function schedulePendingSend(id){
    if(pendingTimers[id]) clearTimeout(pendingTimers[id]);
    var p = pendingByItem[id];
    if(!p) return;
    p.sendAt = Date.now() + PENDING_SEND_MS;
    pendingTimers[id] = setTimeout(function(){ sendPending(id); }, PENDING_SEND_MS);
  }

  function clearPendingTimer(id){
    if(pendingTimers[id]){ clearTimeout(pendingTimers[id]); delete pendingTimers[id]; }
  }

  function cancelPending(id){
    clearPendingTimer(id);
    delete pendingByItem[id];
    render();
  }

  function sendPending(id){
    var p = pendingByItem[id];
    clearPendingTimer(id);
    delete pendingByItem[id];
    if(!p) return;
    var item = state.items.find(function(i){ return i.id === id; });
    if(item && p.qty > 0) submitRequest(item.name, p.qty);
    else render();
  }

  /* ---------------- request actions ---------------- */
  async function submitRequest(itemName, amount){
    if(!itemName || !itemName.trim()) return;
    var msg = {
      id: uid(),
      item: itemName.trim(),
      amount: (amount && amount > 0) ? amount : null,
      requestedBy: state.currentUser.name,
      requestedById: state.currentUser.id,
      sentAt: new Date().toISOString(),
      reminderAt: null,
      reminderNotified: false
    };
    state.messages.unshift(msg);
    await saveMessages();
    showToast("Request sent: " + msg.item + (msg.amount ? " ×" + msg.amount : ""));
  }

  async function addItemToCatalog(name, amount){
    name = name.trim();
    if(!name) return;
    if(state.items.some(function(i){ return i.name.toLowerCase() === name.toLowerCase(); })){
      showToast(name + " is already on the list");
      return;
    }
    state.items.push({id:uid(), name:name, amount:(amount && amount > 0) ? amount : 1});
    await saveItems();
    showToast("Added \"" + name + "\" to the item list");
    render();
  }

  async function saveItemEdit(id, name, amount){
    var it = state.items.find(function(i){ return i.id === id; });
    if(!it) return;
    name = name.trim();
    if(!name){ showToast("Item needs a name"); return; }
    if(state.items.some(function(i){ return i.id !== id && i.name.toLowerCase() === name.toLowerCase(); })){
      showToast("Another item already has that name"); return;
    }
    it.name = name;
    it.amount = (amount && amount > 0) ? amount : 1;
    await saveItems();
    state.itemEditor = null;
    showToast("Saved changes to \"" + name + "\"");
    render();
  }

  async function removeItemFromCatalog(id){
    var it = state.items.find(function(i){ return i.id === id; });
    state.items = state.items.filter(function(i){ return i.id !== id; });
    await saveItems();
    state.modal = null;
    state.itemEditor = null;
    showToast(it ? "Removed \"" + it.name + "\" from the item list" : "Item removed");
    render();
  }

  /* ---------------- reminder actions ---------------- */
  async function setReminder(msgId, iso){
    var m = state.messages.find(function(mm){ return mm.id === msgId; });
    if(!m) return;
    m.reminderAt = iso;
    m.reminderNotified = false;
    await saveMessages();
    state.reminderEditor = null;
    showToast("Reminder set for " + fmtDate(iso));
    render();
  }

  async function clearReminder(msgId){
    var m = state.messages.find(function(mm){ return mm.id === msgId; });
    if(!m) return;
    m.reminderAt = null;
    m.reminderNotified = false;
    await saveMessages();
    render();
  }

  function checkDueReminders(){
    var due = state.messages.filter(function(m){
      return m.reminderAt && !m.reminderNotified && new Date(m.reminderAt).getTime() <= Date.now();
    });
    if(due.length === 0) return;
    due.forEach(function(m){ m.reminderNotified = true; });
    saveMessages();
    if(due.length === 1) showToast("Reminder: " + due[0].item + " is due");
    else showToast(due.length + " reminders are due");
  }

  /* ---------------- staff (order-placement) reminders ---------------- */
  async function scheduleStaffReminder(targetIds, scheduledAtIso, message){
    if(targetIds.length === 0){ showToast("Pick at least one worker"); return; }
    if(!message || !message.trim()){ showToast("Add a short message"); return; }
    var reminder = {
      id: uid(),
      targetIds: targetIds,
      scheduledAt: scheduledAtIso,
      message: message.trim(),
      createdBy: state.currentUser.name,
      createdAt: new Date().toISOString(),
      dismissedBy: []
    };
    state.staffReminders.push(reminder);
    await saveStaffReminders();
    state.reminderHistory.push({
      id: reminder.id, targetIds: targetIds.slice(), scheduledAt: reminder.scheduledAt,
      message: reminder.message, createdBy: reminder.createdBy, createdAt: reminder.createdAt
    });
    await saveReminderHistory();
    showToast("Reminder scheduled for " + targetIds.length + " worker" + (targetIds.length===1?"":"s"));
    render();
  }

  async function deleteStaffReminder(id){
    state.staffReminders = state.staffReminders.filter(function(r){ return r.id !== id; });
    await saveStaffReminders();
    state.modal = null;
    showToast("Reminder cancelled");
    render();
  }

  async function clearReminderHistory(){
    state.reminderHistory = [];
    await saveReminderHistory();
    state.showReminderHistory = false;
    state.confirmClearHistoryInline = false;
    showToast("Reminder history cleared");
    render();
  }

  async function dismissStaffReminder(id){
    var r = state.staffReminders.find(function(rr){ return rr.id === id; });
    if(!r) return;
    if(r.dismissedBy.indexOf(state.currentUser.id) === -1) r.dismissedBy.push(state.currentUser.id);
    await saveStaffReminders();
    render();
  }

  function activeStaffRemindersFor(userId){
    var now = Date.now();
    return state.staffReminders.filter(function(r){
      return r.targetIds.indexOf(userId) !== -1 &&
             new Date(r.scheduledAt).getTime() <= now &&
             r.dismissedBy.indexOf(userId) === -1;
    });
  }

  async function deleteMessage(id){
    state.messages = state.messages.filter(function(m){ return m.id !== id; });
    await saveMessages();
    state.modal = null;
    render();
  }

  async function clearAllRequests(){
    state.messages = [];
    await saveMessages();
    state.modal = null;
    state.confirmEraseAllInline = false;
    showToast("All requests cleared");
    render();
  }

  /* ---------------- account actions ---------------- */
  function canManage(actor, target){
    if(actor.role === "owner") return target.role !== "owner";
    if(actor.role === "manager") return target.role === "worker";
    return false;
  }

  async function addAccount(name, password, role, phone, email){
    name = name.trim();
    if(!name || !password){ showToast("Name and password required"); return; }
    if(state.accounts.some(function(a){ return a.name.toLowerCase() === name.toLowerCase(); })){
      showToast("That name is already in use"); return;
    }
    state.accounts.push({id:uid(), name:name, password:password, role:role, locked:false, phone:(phone||"").trim(), email:(email||"").trim()});
    await saveAccounts();
    showToast("Account added: " + name);
    render();
  }

  async function saveAccountContact(id, phone, email){
    var a = state.accounts.find(function(x){ return x.id === id; });
    if(!a) return;
    a.phone = (phone||"").trim();
    a.email = (email||"").trim();
    await saveAccounts();
    state.acctEditor = null;
    showToast("Saved contact info for " + a.name);
    render();
  }

  async function toggleLock(acct){
    acct.locked = !acct.locked;
    await saveAccounts();
    showToast(acct.locked ? "Locked " + acct.name : "Unlocked " + acct.name);
    render();
  }

  async function deleteAccount(id){
    state.accounts = state.accounts.filter(function(a){ return a.id !== id; });
    await saveAccounts();
    state.modal = null;
    showToast("Account deleted");
    render();
  }

  function confirmModal(opts){
    state.modal = opts;
    render();
  }

  /* ---------------- render ---------------- */
  function render(){
    var root = document.getElementById("root");
    if(state.loading){
      root.innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;font-family:IBM Plex Mono,monospace;color:var(--ink-soft);font-size:12px;">Loading…</div>';
      return;
    }
    if(state.view === "login"){
      root.innerHTML = renderLogin();
      bindLogin();
      return;
    }

    var html = renderTopbar() + '<div class="screen" id="screenArea">' + renderScreen() + '</div>' + renderTabbar();
    if(state.modal) html += renderModal();
    if(state.itemEditor) html += renderItemEditorModal();
    if(state.reminderEditor) html += renderReminderModal();
    if(state.acctEditor) html += renderAcctEditorModal();
    if(state.showReminderHistory) html += renderReminderHistoryModal();
    if(state.toast) html += '<div class="toast">' + esc(state.toast) + '</div>';
    root.innerHTML = html;
    bindGlobal();
  }

  function renderScreen(){
    if(state.view === "request") return renderRequestScreen();
    if(state.view === "myRequests") return renderMyRequestsScreen();
    if(state.view === "allRequests") return renderAllRequestsScreen();
    if(state.view === "accounts") return renderAccountsScreen();
    return "";
  }

  function renderStaffReminderBanner(){
    var active = activeStaffRemindersFor(state.currentUser.id);
    if(active.length === 0) return "";
    return active.map(function(r){
      return '' +
      '<div class="staff-reminder-banner">' +
        '<div class="staff-reminder-icon">⏰</div>' +
        '<div class="staff-reminder-body">' +
          '<div class="staff-reminder-title">Reminder from ' + esc(r.createdBy) + '</div>' +
          '<div class="staff-reminder-msg">' + esc(r.message) + '</div>' +
        '</div>' +
        '<button class="staff-reminder-dismiss" data-dismiss-staff-reminder="' + r.id + '">Dismiss</button>' +
      '</div>';
    }).join("");
  }

  function renderRequestScreen(){
    var canManageCatalog = state.currentUser.role !== "worker";
    var grid = state.items.map(function(item, i){
      var pending = pendingByItem[item.id];
      if(pending){
        var remainingMs = Math.max(0, pending.sendAt - Date.now());
        return '<div class="item-cell">' +
            '<div class="item-pending-card">' +
              '<button type="button" class="item-pending-top" data-item-id="' + item.id + '">' +
                '<span class="item-idx">' + String(i+1).padStart(2,"0") + '</span>' +
                '<span class="item-name">' + esc(item.name) + '</span>' +
              '</button>' +
              '<div class="qty-stepper">' +
                '<button type="button" class="qty-btn" data-qty-dec="' + item.id + '">−</button>' +
                '<input class="qty-input" type="number" min="0" inputmode="numeric" value="' + pending.qty + '" data-qty-input="' + item.id + '" />' +
                '<button type="button" class="qty-btn" data-qty-inc="' + item.id + '">+</button>' +
              '</div>' +
              '<div class="item-pending-bar"><div class="item-pending-fill" style="animation-duration:' + remainingMs + 'ms"></div></div>' +
              '<div class="item-pending-actions">' +
                '<button type="button" class="item-pending-send" data-qty-send="' + item.id + '">Send now</button>' +
                '<button type="button" class="item-pending-cancel" data-qty-cancel="' + item.id + '">Cancel</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }
      return '<div class="item-cell">' +
          '<button class="item-btn" data-item-id="' + item.id + '">' +
            '<span class="item-idx">' + String(i+1).padStart(2,"0") + '</span>' +
            '<span class="item-name">' + esc(item.name) + '</span>' +
            '<span class="item-qty">Qty: ' + item.amount + '</span>' +
          '</button>' +
          (canManageCatalog ? '<button class="item-edit-link" data-edit-item="' + item.id + '">edit</button>' : '') +
        '</div>';
    }).join("");
    var html = renderStaffReminderBanner() +
      '<h2 class="section-title">Request Item</h2>' +
      '<div class="item-grid">' + grid + '</div>' +
      '<h2 class="section-title">Other</h2>' +
      '<div class="panel-card">' +
        '<div class="other-row">' +
          '<input id="otherItem" placeholder="Type item name…" />' +
          '<button class="btn btn-accent" id="otherSendBtn">Send</button>' +
        '</div>' +
      '</div>';
    if(canManageCatalog){
      html += '' +
        '<h2 class="section-title">Create New Item</h2>' +
        '<div class="panel-card">' +
          '<div class="field"><label>Item name</label><input id="newItemName" placeholder="e.g. Sesame Oil" /></div>' +
          '<div class="field"><label>Amount to get</label><input id="newItemAmount" type="number" min="1" placeholder="Qty" value="1" /></div>' +
          '<button class="btn btn-primary btn-block" id="addItemBtn">Create item</button>' +
        '</div>';
    }
    return html;
  }

  function renderMessageList(messages, opts){
    opts = opts || {};
    if(messages.length === 0){
      return '<div class="empty-state"><div class="glyph">—</div><p>No requests yet.<br/>Nothing on the rail.</p></div>';
    }
    return messages.map(function(m){
      var el = elapsedInfo(m.sentAt);
      var canDelete = opts.allowDeleteAll || (opts.selfId && m.requestedById === opts.selfId);
      var reminderDue = m.reminderAt && new Date(m.reminderAt).getTime() <= Date.now();
      var reminderRow;
      if(m.reminderAt){
        reminderRow = '<div class="reminder-tag ' + (reminderDue ? 'reminder-due' : '') + '">' +
          '⏰ ' + (reminderDue ? 'Reminder due' : 'Reminder ' + fmtDate(m.reminderAt)) +
          ' <button class="clear-reminder-link" data-clear-reminder="' + m.id + '">clear</button></div>';
      } else {
        reminderRow = '<button class="set-reminder-link" data-set-reminder="' + m.id + '">⏰ Set reminder</button>';
      }
      return '' +
      '<div class="chit ' + (reminderDue ? 'chit-reminder-due' : '') + '">' +
        '<div class="chit-row">' +
          '<div>' +
            '<div class="chit-item">' + esc(m.item) + (m.amount ? ' <span class="qty-tag">×' + m.amount + '</span>' : '') + '</div>' +
            '<div class="chit-meta">' + fmtDate(m.sentAt) + (opts.showRequester ? ' · ' + esc(m.requestedBy) : '') + '</div>' +
          '</div>' +
          '<div class="chit-elapsed ' + el.cls + '">' + el.label + '</div>' +
        '</div>' +
        '<div class="chit-actions-row">' +
          reminderRow +
          (canDelete ? '<button class="del-link" data-del-msg="' + m.id + '">delete</button>' : '') +
        '</div>' +
      '</div>';
    }).join("");
  }

  function renderMyRequestsScreen(){
    var mine = state.messages.filter(function(m){ return m.requestedById === state.currentUser.id; });
    return '<h2 class="section-title">My Requests</h2>' + renderMessageList(mine, {selfId: state.currentUser.id});
  }

  function renderAllRequestsScreen(){
    var count = state.messages.length;
    var html = '<h2 class="section-title">Open Requests (' + count + ')' +
        (count > 0 ? ' <button type="button" class="erase-all-link" data-erase-all-a="1">clear all</button>' : '') +
      '</h2>' +
      renderMessageList(state.messages, {allowDeleteAll:true, showRequester:true});
    if(count > 0){
      html += '' +
        '<div class="erase-all-variants">' +
          '<div class="erase-variant-label">Variant B — danger button</div>' +
          '<button type="button" class="btn btn-accent btn-block" data-erase-all-b="1">Erase All Requests</button>' +
          '<div class="erase-variant-label">Variant C — icon button, inline confirm</div>' +
          (state.confirmEraseAllInline ?
            '<div class="erase-inline-confirm">' +
              '<span>Erase all ' + count + ' requests?</span>' +
              '<button type="button" class="btn-inline-yes" data-erase-all-c-confirm="1">Yes, erase</button>' +
              '<button type="button" class="btn-inline-no" data-erase-all-c-cancel="1">No</button>' +
            '</div>'
          : '<button type="button" class="erase-icon-btn" data-erase-all-c="1">🗑 Erase all</button>') +
        '</div>';
    }
    return html;
  }

  function renderAccountsScreen(){
    var u = state.currentUser;
    var roleOptions = '<option value="worker">Worker</option>' + (u.role === "owner" ? '<option value="manager">Manager</option>' : '');
    var addCard = '' +
      '<div class="panel-card">' +
        '<h3>Add account</h3>' +
        '<div class="field"><label>Name</label><input id="newName" placeholder="Full name" /></div>' +
        '<div class="field"><label>Assigned password</label><input id="newPass" placeholder="Password" /></div>' +
        '<div class="field"><label>Role</label><select id="newRole">' + roleOptions + '</select></div>' +
        '<div class="field"><label>Phone</label><input id="newPhone" type="tel" placeholder="(317) 555-0100" /></div>' +
        '<div class="field"><label>Email</label><input id="newEmail" type="email" placeholder="name@hasuno.com" /></div>' +
        '<button class="btn btn-primary btn-block" id="addAcctBtn">Add account</button>' +
      '</div>';

    var rows = state.accounts.map(function(a){
      var manageable = canManage(u, a);
      var contactLine = (a.phone || a.email) ?
        '<div class="acct-contact">' + [a.phone, a.email].filter(Boolean).map(esc).join(' · ') + '</div>' :
        '<div class="acct-contact acct-contact-empty">no phone/email on file</div>';
      var actions = manageable ? '' +
        '<div class="acct-actions">' +
          '<button class="icon-btn" data-edit-contact="' + a.id + '">Contact</button>' +
          '<button class="icon-btn" data-lock="' + a.id + '">' + (a.locked ? "Unlock" : "Lock") + '</button>' +
          '<button class="icon-btn danger" data-delacct="' + a.id + '">Delete</button>' +
        '</div>' : '';
      return '' +
      '<div class="acct-row">' +
        '<div>' +
          '<div class="acct-name">' + esc(a.name) + ' <span class="role-tag role-' + a.role + '">' + a.role + '</span></div>' +
          contactLine +
          (a.locked ? '<div class="locked-badge">locked</div>' : '') +
        '</div>' +
        actions +
      '</div>';
    }).join("");

    return '<h2 class="section-title">Manage Accounts</h2>' +
      '<button type="button" class="reminder-history-tab-btn" data-open-reminder-history="1">' +
        '⏰ Reminder History' +
        (state.reminderHistory.length > 0 ? ' <span class="reminder-history-count">' + state.reminderHistory.length + '</span>' : '') +
      '</button>' +
      addCard +
      '<h2 class="section-title">All Accounts (' + state.accounts.length + ')</h2>' + rows +
      renderStaffReminderPanel();
  }

  function renderReminderHistoryModal(){
    var items = state.reminderHistory.slice().reverse();
    var list = items.length === 0 ?
      '<p class="panel-empty-note">No reminders have been sent yet.</p>' :
      items.map(function(r){
        var names = r.targetIds.map(function(id){
          var a = state.accounts.find(function(x){ return x.id === id; });
          return a ? a.name : "(removed)";
        }).join(", ") || "(no one)";
        return '' +
        '<div class="staff-reminder-row">' +
          '<div>' +
            '<div class="staff-reminder-row-msg">' + esc(r.message) + '</div>' +
            '<div class="staff-reminder-row-meta">' + esc(names) + ' · ' + fmtDate(r.scheduledAt) + ' · sent by ' + esc(r.createdBy) + '</div>' +
          '</div>' +
        '</div>';
      }).join("");
    var actions = state.confirmClearHistoryInline ?
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" id="reminderHistoryClearCancel">Cancel</button>' +
        '<button class="btn btn-accent" id="reminderHistoryClearConfirm">Yes, clear all</button>' +
      '</div>' :
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" id="reminderHistoryClose">Close</button>' +
        (state.reminderHistory.length > 0 ? '<button class="btn btn-accent" id="reminderHistoryClearAll">Clear all history</button>' : '') +
      '</div>';
    return '' +
    '<div class="modal-backdrop" id="reminderHistoryBackdrop">' +
      '<div class="modal-card">' +
        '<h3>Reminder History (' + state.reminderHistory.length + ')</h3>' +
        '<div class="reminder-history-list">' + list + '</div>' +
        (state.confirmClearHistoryInline ? '<p>This permanently erases the reminder history log. Currently scheduled reminders are not affected.</p>' : '') +
        actions +
      '</div>' +
    '</div>';
  }

  function renderStaffReminderPanel(){
    var workers = state.accounts.filter(function(a){ return a.role === "worker" && !a.locked; });
    var checkboxes = workers.length === 0 ?
      '<p class="panel-empty-note">No active workers to remind yet.</p>' :
      workers.map(function(w){
        return '<label class="worker-check-row">' +
          '<input type="checkbox" data-worker-checkbox value="' + w.id + '" />' +
          '<span>' + esc(w.name) + '</span>' +
        '</label>';
      }).join("");

    var quick = [
      {label:"Now", value:"now"},
      {label:"In 1 hour", value:"1h"},
      {label:"Tomorrow 9am", value:"tomorrow9"},
      {label:"Custom", value:"custom"}
    ];
    var quickHtml = quick.map(function(q, i){
      return '<label class="when-radio-row">' +
        '<input type="radio" name="staffReminderWhen" value="' + q.value + '"' + (i===0?' checked':'') + ' />' +
        '<span>' + q.label + '</span>' +
      '</label>';
    }).join("");

    var sentList = state.staffReminders.length === 0 ? '' : '' +
      '<h2 class="section-title" style="margin-top:26px;">Scheduled / Sent Reminders</h2>' +
      state.staffReminders.map(function(r){
        var names = r.targetIds.map(function(id){
          var a = state.accounts.find(function(x){ return x.id === id; });
          return a ? a.name : "(removed)";
        }).join(", ");
        var due = new Date(r.scheduledAt).getTime() <= Date.now();
        return '' +
        '<div class="staff-reminder-row">' +
          '<div>' +
            '<div class="staff-reminder-row-msg">' + esc(r.message) + '</div>' +
            '<div class="staff-reminder-row-meta">' + names + ' · ' + fmtDate(r.scheduledAt) + (due ? ' · sent' : ' · scheduled') + '</div>' +
          '</div>' +
          '<button class="del-link" data-del-staff-reminder="' + r.id + '">cancel</button>' +
        '</div>';
      }).join("");

    return '' +
      '<h2 class="section-title" style="margin-top:26px;">Remind Workers to Order</h2>' +
      '<div class="panel-card">' +
        '<label class="field-label-plain">Select workers</label>' +
        '<div class="worker-check-grid">' + checkboxes + '</div>' +
        '<label class="field-label-plain" style="margin-top:14px;">Send at</label>' +
        '<div class="when-radio-grid">' + quickHtml + '</div>' +
        '<div class="field" id="staffReminderCustomField" style="margin-top:10px; display:none;">' +
          '<input type="datetime-local" id="staffReminderCustomTime" />' +
        '</div>' +
        '<div class="field" style="margin-top:14px;">' +
          '<label>Message</label>' +
          '<input id="staffReminderMsg" value="Time to place your inventory order." />' +
        '</div>' +
        '<button class="btn btn-accent btn-block" id="sendStaffReminderBtn">Send reminder</button>' +
      '</div>' +
      sentList;
  }

  function renderTabbar(){
    var u = state.currentUser;
    var tabs = [];
    tabs.push({key:"request", label:"Request"});
    if(u.role === "worker"){
      tabs.push({key:"myRequests", label:"My Requests"});
    } else {
      tabs.push({key:"allRequests", label:"Requests", badge: state.messages.length > 0});
      tabs.push({key:"accounts", label:"Accounts"});
    }
    return '<div class="tabbar">' + tabs.map(function(t){
      return '<button class="tab-btn ' + (state.view===t.key?'active':'') + (t.badge?' has-badge':'') + '" data-tab="' + t.key + '">' +
               esc(t.label) + '<span class="tab-dot"></span></button>';
    }).join("") + '</div>';
  }

  function renderModal(){
    var m = state.modal;
    return '' +
    '<div class="modal-backdrop" id="modalBackdrop">' +
      '<div class="modal-card">' +
        '<h3>' + esc(m.title) + '</h3>' +
        '<p>' + esc(m.body) + '</p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="modalCancel">Cancel</button>' +
          '<button class="btn ' + (m.danger ? 'btn-accent' : 'btn-primary') + '" id="modalConfirm">' + esc(m.confirmLabel || "Confirm") + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderItemEditorModal(){
    var e = state.itemEditor;
    return '' +
    '<div class="modal-backdrop" id="itemEditorBackdrop">' +
      '<div class="modal-card">' +
        '<h3>Edit item</h3>' +
        '<div class="field"><label>Name</label><input id="editItemName" value="' + esc(e.name) + '" /></div>' +
        '<div class="field"><label>Amount to get</label><input id="editItemAmount" type="number" min="1" value="' + e.amount + '" /></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="itemEditorCancel">Cancel</button>' +
          '<button class="btn btn-primary" id="itemEditorSave">Save</button>' +
        '</div>' +
        '<button class="del-link" id="itemEditorDelete" style="margin-top:14px;">Remove item from list</button>' +
      '</div>' +
    '</div>';
  }

  function renderAcctEditorModal(){
    var e = state.acctEditor;
    var acct = state.accounts.find(function(a){ return a.id === e.id; });
    return '' +
    '<div class="modal-backdrop" id="acctEditorBackdrop">' +
      '<div class="modal-card">' +
        '<h3>Contact info — ' + esc(acct ? acct.name : "") + '</h3>' +
        '<div class="field"><label>Phone</label><input id="editAcctPhone" type="tel" value="' + esc(e.phone) + '" placeholder="(317) 555-0100" /></div>' +
        '<div class="field"><label>Email</label><input id="editAcctEmail" type="email" value="' + esc(e.email) + '" placeholder="name@hasuno.com" /></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="acctEditorCancel">Cancel</button>' +
          '<button class="btn btn-primary" id="acctEditorSave">Save</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderReminderModal(){
    var msg = state.messages.find(function(m){ return m.id === state.reminderEditor.messageId; });
    var quick = [
      {label:"30 min", mins:30},
      {label:"1 hour", mins:60},
      {label:"3 hours", mins:180},
      {label:"Tomorrow 9am", tomorrow9:true}
    ];
    var quickHtml = quick.map(function(q){
      return '<button class="btn btn-ghost reminder-quick-btn" data-quick-mins="' + (q.mins||"") + '" data-quick-tomorrow9="' + (q.tomorrow9?"1":"") + '">' + q.label + '</button>';
    }).join("");
    return '' +
    '<div class="modal-backdrop" id="reminderBackdrop">' +
      '<div class="modal-card">' +
        '<h3>Set a reminder</h3>' +
        '<p>' + (msg ? esc(msg.item) + ' — ' : '') + 'you\'ll see a highlighted notice once the reminder time passes while the app is open.</p>' +
        '<div class="reminder-quick-grid">' + quickHtml + '</div>' +
        '<div class="field" style="margin-top:14px;"><label>Or pick exact time</label><input type="datetime-local" id="reminderCustom" /></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="reminderCancel">Cancel</button>' +
          '<button class="btn btn-primary" id="reminderSaveCustom">Set</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- event binding ---------------- */
  function bindGlobal(){
    var logoutBtn = document.getElementById("logoutBtn");
    if(logoutBtn) logoutBtn.addEventListener("click", logout);

    document.querySelectorAll("[data-tab]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.view = btn.getAttribute("data-tab");
        render();
      });
    });

    // request screen
    document.querySelectorAll("[data-item-id]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var item = state.items.find(function(i){ return i.id === btn.getAttribute("data-item-id"); });
        if(item) beginOrBumpPending(item);
      });
    });
    document.querySelectorAll("[data-qty-inc]").forEach(function(btn){
      btn.addEventListener("click", function(){
        bumpPendingQty(btn.getAttribute("data-qty-inc"), 1);
      });
    });
    document.querySelectorAll("[data-qty-dec]").forEach(function(btn){
      btn.addEventListener("click", function(){
        bumpPendingQty(btn.getAttribute("data-qty-dec"), -1);
      });
    });
    document.querySelectorAll("[data-qty-input]").forEach(function(input){
      input.addEventListener("change", function(){
        var n = parseInt(input.value, 10);
        setPendingQty(input.getAttribute("data-qty-input"), isNaN(n) ? 0 : n);
      });
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter") input.blur();
      });
    });
    document.querySelectorAll("[data-qty-send]").forEach(function(btn){
      btn.addEventListener("click", function(){
        sendPending(btn.getAttribute("data-qty-send"));
      });
    });
    document.querySelectorAll("[data-qty-cancel]").forEach(function(btn){
      btn.addEventListener("click", function(){
        cancelPending(btn.getAttribute("data-qty-cancel"));
      });
    });
    document.querySelectorAll("[data-edit-item]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id = el.getAttribute("data-edit-item");
        var item = state.items.find(function(i){ return i.id === id; });
        if(item){ state.itemEditor = {id:item.id, name:item.name, amount:item.amount}; render(); }
      });
    });
    var otherBtn = document.getElementById("otherSendBtn");
    if(otherBtn){
      otherBtn.addEventListener("click", function(){
        var input = document.getElementById("otherItem");
        submitRequest(input.value, null);
        input.value = "";
      });
    }
    var addItemBtn = document.getElementById("addItemBtn");
    if(addItemBtn){
      addItemBtn.addEventListener("click", function(){
        var nameInput = document.getElementById("newItemName");
        var amtInput = document.getElementById("newItemAmount");
        addItemToCatalog(nameInput.value, parseInt(amtInput.value, 10));
        nameInput.value = "";
        amtInput.value = "1";
      });
    }

    // reminders
    document.querySelectorAll("[data-set-reminder]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.reminderEditor = {messageId: btn.getAttribute("data-set-reminder")};
        render();
      });
    });
    document.querySelectorAll("[data-clear-reminder]").forEach(function(btn){
      btn.addEventListener("click", function(){
        clearReminder(btn.getAttribute("data-clear-reminder"));
      });
    });
    document.querySelectorAll("[data-dismiss-staff-reminder]").forEach(function(btn){
      btn.addEventListener("click", function(){
        dismissStaffReminder(btn.getAttribute("data-dismiss-staff-reminder"));
      });
    });

    // delete message
    document.querySelectorAll("[data-del-msg]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-del-msg");
        var msg = state.messages.find(function(m){ return m.id === id; });
        confirmModal({
          title: "Delete this request?",
          body: '"' + msg.item + '" requested by ' + msg.requestedBy + '. This can\'t be undone.',
          confirmLabel: "Delete",
          danger: true,
          onConfirm: function(){ deleteMessage(id); }
        });
      });
    });

    // erase all requests — variants A & B both confirm via modal, C confirms inline
    document.querySelectorAll("[data-erase-all-a], [data-erase-all-b]").forEach(function(btn){
      btn.addEventListener("click", function(){
        confirmModal({
          title: "Erase all requests?",
          body: "This clears all " + state.messages.length + " open requests for everyone. This can't be undone.",
          confirmLabel: "Erase all",
          danger: true,
          onConfirm: function(){ clearAllRequests(); }
        });
      });
    });
    var eraseAllC = document.querySelector("[data-erase-all-c]");
    if(eraseAllC){
      eraseAllC.addEventListener("click", function(){
        state.confirmEraseAllInline = true;
        render();
      });
    }
    var eraseAllCConfirm = document.querySelector("[data-erase-all-c-confirm]");
    if(eraseAllCConfirm){
      eraseAllCConfirm.addEventListener("click", function(){
        clearAllRequests();
      });
    }
    var eraseAllCCancel = document.querySelector("[data-erase-all-c-cancel]");
    if(eraseAllCCancel){
      eraseAllCCancel.addEventListener("click", function(){
        state.confirmEraseAllInline = false;
        render();
      });
    }

    // accounts screen
    var addAcctBtn = document.getElementById("addAcctBtn");
    if(addAcctBtn){
      addAcctBtn.addEventListener("click", function(){
        var name = document.getElementById("newName").value;
        var pass = document.getElementById("newPass").value;
        var role = document.getElementById("newRole").value;
        var phone = document.getElementById("newPhone").value;
        var email = document.getElementById("newEmail").value;
        addAccount(name, pass, role, phone, email);
      });
    }
    document.querySelectorAll("[data-lock]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-lock");
        var acct = state.accounts.find(function(a){ return a.id === id; });
        toggleLock(acct);
      });
    });
    document.querySelectorAll("[data-edit-contact]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-edit-contact");
        var acct = state.accounts.find(function(a){ return a.id === id; });
        if(acct){ state.acctEditor = {id:acct.id, phone:acct.phone, email:acct.email}; render(); }
      });
    });
    document.querySelectorAll("[data-delacct]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-delacct");
        var acct = state.accounts.find(function(a){ return a.id === id; });
        confirmModal({
          title: "Delete " + acct.name + "'s account?",
          body: "They will no longer be able to sign in. This can't be undone.",
          confirmLabel: "Delete account",
          danger: true,
          onConfirm: function(){ deleteAccount(id); }
        });
      });
    });

    // remind-workers panel
    var whenRadios = document.querySelectorAll('input[name="staffReminderWhen"]');
    if(whenRadios.length){
      var customField = document.getElementById("staffReminderCustomField");
      whenRadios.forEach(function(r){
        r.addEventListener("change", function(){
          customField.style.display = (r.value === "custom" && r.checked) ? "block" : customField.style.display;
          if(r.checked && r.value !== "custom") customField.style.display = "none";
        });
      });
    }
    var sendStaffReminderBtn = document.getElementById("sendStaffReminderBtn");
    if(sendStaffReminderBtn){
      sendStaffReminderBtn.addEventListener("click", function(){
        var ids = Array.prototype.map.call(
          document.querySelectorAll("[data-worker-checkbox]:checked"),
          function(cb){ return cb.value; }
        );
        var whenChoice = document.querySelector('input[name="staffReminderWhen"]:checked');
        var whenVal = whenChoice ? whenChoice.value : "now";
        var when;
        if(whenVal === "now"){
          when = new Date();
        } else if(whenVal === "1h"){
          when = new Date(Date.now() + 60*60000);
        } else if(whenVal === "tomorrow9"){
          when = new Date(); when.setDate(when.getDate()+1); when.setHours(9,0,0,0);
        } else {
          var customVal = document.getElementById("staffReminderCustomTime").value;
          if(!customVal){ showToast("Pick a custom date and time"); return; }
          when = new Date(customVal);
        }
        var msg = document.getElementById("staffReminderMsg").value;
        scheduleStaffReminder(ids, when.toISOString(), msg);
      });
    }
    document.querySelectorAll("[data-del-staff-reminder]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-del-staff-reminder");
        confirmModal({
          title: "Cancel this reminder?",
          body: "Workers who haven't seen it yet won't be notified.",
          confirmLabel: "Cancel reminder",
          danger: true,
          onConfirm: function(){ deleteStaffReminder(id); }
        });
      });
    });

    // reminder history popup
    var openHistoryBtn = document.querySelector("[data-open-reminder-history]");
    if(openHistoryBtn){
      openHistoryBtn.addEventListener("click", function(){
        state.showReminderHistory = true;
        render();
      });
    }
    var reminderHistoryBackdrop = document.getElementById("reminderHistoryBackdrop");
    if(reminderHistoryBackdrop){
      var closeHistory = function(){
        state.showReminderHistory = false;
        state.confirmClearHistoryInline = false;
        render();
      };
      var closeBtn = document.getElementById("reminderHistoryClose");
      if(closeBtn) closeBtn.addEventListener("click", closeHistory);
      var clearAllBtn = document.getElementById("reminderHistoryClearAll");
      if(clearAllBtn){
        clearAllBtn.addEventListener("click", function(){
          state.confirmClearHistoryInline = true;
          render();
        });
      }
      var clearCancelBtn = document.getElementById("reminderHistoryClearCancel");
      if(clearCancelBtn){
        clearCancelBtn.addEventListener("click", function(){
          state.confirmClearHistoryInline = false;
          render();
        });
      }
      var clearConfirmBtn = document.getElementById("reminderHistoryClearConfirm");
      if(clearConfirmBtn){
        clearConfirmBtn.addEventListener("click", function(){
          clearReminderHistory();
        });
      }
      reminderHistoryBackdrop.addEventListener("click", function(e){
        if(e.target === reminderHistoryBackdrop) closeHistory();
      });
    }

    // modal
    var backdrop = document.getElementById("modalBackdrop");
    if(backdrop){
      document.getElementById("modalCancel").addEventListener("click", function(){ state.modal = null; render(); });
      document.getElementById("modalConfirm").addEventListener("click", function(){
        var fn = state.modal.onConfirm;
        if(fn) fn();
      });
      backdrop.addEventListener("click", function(e){
        if(e.target === backdrop){ state.modal = null; render(); }
      });
    }

    // item editor modal
    var itemEditorBackdrop = document.getElementById("itemEditorBackdrop");
    if(itemEditorBackdrop){
      document.getElementById("itemEditorCancel").addEventListener("click", function(){ state.itemEditor = null; render(); });
      document.getElementById("itemEditorSave").addEventListener("click", function(){
        var name = document.getElementById("editItemName").value;
        var amount = parseInt(document.getElementById("editItemAmount").value, 10);
        saveItemEdit(state.itemEditor.id, name, amount);
      });
      document.getElementById("itemEditorDelete").addEventListener("click", function(){
        var id = state.itemEditor.id;
        var item = state.items.find(function(i){ return i.id === id; });
        confirmModal({
          title: 'Remove "' + (item ? item.name : "item") + '" from the list?',
          body: "Workers won't be able to request this item from the grid anymore. They can still type it under Other.",
          confirmLabel: "Remove",
          danger: true,
          onConfirm: function(){ removeItemFromCatalog(id); }
        });
      });
      itemEditorBackdrop.addEventListener("click", function(e){
        if(e.target === itemEditorBackdrop){ state.itemEditor = null; render(); }
      });
    }

    // account contact editor modal
    var acctEditorBackdrop = document.getElementById("acctEditorBackdrop");
    if(acctEditorBackdrop){
      document.getElementById("acctEditorCancel").addEventListener("click", function(){ state.acctEditor = null; render(); });
      document.getElementById("acctEditorSave").addEventListener("click", function(){
        var phone = document.getElementById("editAcctPhone").value;
        var email = document.getElementById("editAcctEmail").value;
        saveAccountContact(state.acctEditor.id, phone, email);
      });
      acctEditorBackdrop.addEventListener("click", function(e){
        if(e.target === acctEditorBackdrop){ state.acctEditor = null; render(); }
      });
    }

    // reminder modal
    var reminderBackdrop = document.getElementById("reminderBackdrop");
    if(reminderBackdrop){
      document.getElementById("reminderCancel").addEventListener("click", function(){ state.reminderEditor = null; render(); });
      document.querySelectorAll(".reminder-quick-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          var mins = btn.getAttribute("data-quick-mins");
          var tomorrow9 = btn.getAttribute("data-quick-tomorrow9");
          var when;
          if(tomorrow9){
            when = new Date();
            when.setDate(when.getDate() + 1);
            when.setHours(9,0,0,0);
          } else {
            when = new Date(Date.now() + parseInt(mins,10) * 60000);
          }
          setReminder(state.reminderEditor.messageId, when.toISOString());
        });
      });
      document.getElementById("reminderSaveCustom").addEventListener("click", function(){
        var val = document.getElementById("reminderCustom").value;
        if(!val){ showToast("Pick a date and time first"); return; }
        setReminder(state.reminderEditor.messageId, new Date(val).toISOString());
      });
      reminderBackdrop.addEventListener("click", function(e){
        if(e.target === reminderBackdrop){ state.reminderEditor = null; render(); }
      });
    }
  }

  // live-refresh elapsed labels + check due reminders without losing focus/state
  setInterval(function(){
    checkDueReminders();
    if(state.view === "allRequests" || state.view === "myRequests" || state.view === "request"){
      render();
    }
  }, 30000);

  loadData();
})();
</script>
</body>
</html>
